<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"
    name="viewport"
    content="width=device-width, initial-scale=1.0">
    <title> LaTeXito </title>
    <link rel="icon" type="image/jpg" href="LaTeXito.jpg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="oculto" id="overlay">
        <div id="hud">
            <div id="tablas">
                <table id="referencias">
                    <tr>
                        <th>
                            Palabra
                        </th>
                        <th>
                            Símbolo
                        </th>
                    </tr>
                </table>
            </div>
        </div>
    </div>
    <div id="principal">
        <div class="extra">
            <div class="contenedor"> 
                <label for="entrada"> Entrada</label>
                <textarea class="boxel" id="entrada" placeholder="Ingrese texto... (Ej: paraTodo, existe, n_0)" spellcheck="false" autocorrect="off"></textarea>
                <button class="boton" id="procesar">
                Procesar
                </button>
            </div>
            <div class="contenedor">
                <label for="salida">Salida</label>

                <div id="contenedorSalida">
                    <textarea class="boxel" id="salida"
                        placeholder="procesado dinámico con ╰───╯ (espacio) en PC."
                        disabled spellcheck="false"></textarea>
                </div>

                <button class="boton" id="copiar">
                    <img src="portapapeles.png" alt="boton para copiar" width="100%" height="100%">
                </button>
            </div>
        </div>
        
        <button class="boton" id="documentacion">
            documentación
        </button>
    </div>
    <script src="script.js"></script>
</body>

</html>
