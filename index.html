<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"
    name="viewport"
    content="width=device-width, initial-scale=1.0">
    <title> LaTeXito </title>
    <link rel="icon" type="image/jpg" href="LaTeXito.jpg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="principal">
        <div class="extra">
            <div class="contenedor"> 
                <label for="entrada"> Entrada</label>
                <textarea class="boxel" id="entrada" placeholder="Ingrese texto..."></textarea>
            </div>
            <div class="contenedor"> 
                <label for="salida"> Salida</label>
                <textarea class="boxel" id="salida" placeholder="procesado dinámico con ╰───╯ (espacio) en PC." disabled></textarea> 
            </div>
        </div>
        <div class="extra2">
            <button class="boton" id="procesar">
                Procesar
            </button>
            <button class="boton" id="copiar">
                <img src="portapapeles.png" alt="boton para copiar" width="100%" height="100%">
            </button>
        </div>
        
        <h1>Revisar la 
            <a href="https://github.com/TobiasIvanGodoy/LaTeXito" target="_blank">documentación</a>
            para ver el diccionario completo
        </h1>
    </div>
    <script src="script.js"></script>
</body>

</html>
